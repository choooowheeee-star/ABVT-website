<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShop Order Website</title>
    <style>
        :root {
            --primary-color: #00838f; /* Deep Teal */
            --primary-hover: #005f66; /* Darker Teal */
            --bg-color: #f4fcfc;
            --text-color: #2b3a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            background-color: rgba(0, 131, 143, 0.9);
            color: white;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h2 {
            border-bottom: 2px solid rgba(0, 131, 143, 0.3);
            padding-bottom: 0.5rem;
            margin-top: 0;
            color: #005f66;
        }

        .panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 131, 143, 0.2);
        }

        .product-card.sold-out {
            opacity: 0.7;
            background: rgba(240, 240, 240, 0.9);
        }

        .product-card h3 {
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }

        .product-price {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
        }

        .sold-out-badge {
            color: #b71c1c;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            padding: 1rem 0;
        }

        .product-options {
            margin-bottom: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.9rem;
        }

        .product-options label {
            font-weight: 600;
            color: #005f66;
        }

        .product-options select, 
        .product-options input {
            padding: 0.4rem;
            border: 1px solid #b2dfdb;
            border-radius: 4px;
            background: white;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #b0bec5;
            cursor: not-allowed;
        }

        /* Cart Section */
        .cart-section {
            height: fit-content;
        }

        .cart-items {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item-details {
            font-size: 0.9rem;
        }

        .remove-btn {
            background: #b71c1c;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        .remove-btn:hover {
            background: #7f0000;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 1.5rem;
            color: var(--primary-hover);
        }

        /* Checkout Form */
        .checkout-form input,
        .checkout-form label {
            width: 100%;
            box-sizing: border-box;
        }

        .checkout-form input[type="text"],
        .checkout-form input[type="email"],
        .checkout-form input[type="tel"],
        .checkout-form input[type="file"] {
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid #b2dfdb;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.9);
        }

        .checkout-form label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #005f66;
            margin-bottom: 0.2rem;
            display: block;
        }

        .checkout-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0, 131, 143, 0.3);
        }

        .checkout-form button {
            width: 100%;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>QuickShop Store</h1>
        <p>Select your sizes, colors, quantities (1-20) and upload payment receipt instantly!</p>
    </header>

    <div class="container">
        <!-- Product Catalog -->
        <div class="panel">
            <h2>Our Products</h2>
            <div class="products-grid" id="products-grid">
                <!-- Products injected via JavaScript -->
            </div>
        </div>

        <!-- Cart & Checkout -->
        <div class="panel cart-section">
            <h2>Your Cart</h2>
            <ul class="cart-items" id="cart-items">
                <li style="color: #666; text-align: center;">Cart is empty</li>
            </ul>
            <div class="cart-total" id="cart-total">Total: ₱0.00</div>

            <div class="checkout-form">
                <h2>Checkout</h2>
                <input type="text" id="customer-name" placeholder="Full Name" required>
                <input type="email" id="customer-email" placeholder="Email Address" required>
                <input type="text" id="customer-address" placeholder="Delivery Address" required>
                <input type="tel" id="customer-phone" placeholder="Phone Number" required>
                
                <label for="payment-screenshot">Payment Proof Screenshot</label>
                <input type="file" id="payment-screenshot" accept="image/*" required>
                
                <button id="order-btn" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyEaq5yv9dKoMlMrBgZxJdNHHCloQWXPQyeC5WkOGbjz8wCL-DG7VmG_NPiTUPNwtK3Zw/exec";

        const products = [
            { 
                id: 1, 
                name: "Light Blue T-Shirt", 
                price: 499.00, 
                type: "shirt", 
                options: ["S", "M", "L", "XL", "XXL"],
                soldOut: false 
            },
            { 
                id: 2, 
                name: "Black T-Shirt", 
                price: 499.00, 
                type: "shirt", 
                options: ["S", "M", "L", "XL", "XXL"],
                soldOut: false 
            },
            { 
                id: 3, 
                name: "Two-Toned Cap", 
                price: 199.00, 
                type: "cap", 
                options: ["Cream and Brown", "Aqua and Blue"],
                soldOut: false 
            }
        ];

        let cart = [];

        // Fetch inventory status from Google Sheets backend on load
        async function fetchInventoryStatus() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getInventory`);
                const inventoryData = await response.json();
                
                // Expecting inventoryData to map product names or IDs to their total ordered quantity
                // e.g. { "Light Blue T-Shirt": 200, "Black T-Shirt": 45, ... }
                if (inventoryData && typeof inventoryData === 'object') {
                    products.forEach(product => {
                        if (inventoryData[product.name] >= 200) {
                            product.soldOut = true;
                        }
                    });
                }
            } catch (error) {
                console.log('Could not fetch live inventory counts, defaulting to available stock.', error);
            } finally {
                renderProducts();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(product => {
                if (product.soldOut) {
                    return `
                        <div class="product-card sold-out">
                            <div>
                                <h3>${product.name}</h3>
                                <div class="product-price">₱${product.price.toFixed(2)}</div>
                                <div class="sold-out-badge">SOLD OUT</div>
                            </div>
                            <button disabled>Unavailable</button>
                        </div>
                    `;
                }

                let optionLabel = product.type === 'shirt' ? 'Size:' : 'Color:';
                let optionsHtml = product.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                
                // Generate quantity dropdown options from 1 to 20
                let qtyOptionsHtml = '';
                for (let i = 1; i <= 20; i++) {
                    qtyOptionsHtml += `<option value="${i}">${i}</option>`;
                }

                return `
                    <div class="product-card">
                        <div>
                            <h3>${product.name}</h3>
                            <div class="product-price">₱${product.price.toFixed(2)}</div>
                            <div class="product-options">
                                <label>${optionLabel}</label>
                                <select id="option-${product.id}">
                                    ${optionsHtml}
                                </select>
                                <label>Quantity (1-20):</label>
                                <select id="qty-${product.id}">
                                    ${qtyOptionsHtml}
                                </select>
                            </div>
                        </div>
                        <button onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                `;
            }).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product.soldOut) {
                alert('This item is sold out.');
                return;
            }

            const selectedOption = document.getElementById(`option-${productId}`).value;
            const quantityInput = parseInt(document.getElementById(`qty-${productId}`).value) || 1;

            const cartItemKey = `${productId}-${selectedOption}`;
            const existingItem = cart.find(item => item.key === cartItemKey);

            let currentCartTotalQuantity = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (currentCartTotalQuantity + quantityInput > 200) {
                alert('Cannot add items. Maximum total quantity limit of 200 items per order reached.');
                return;
            }

            if (existingItem) {
                if (existingItem.quantity + quantityInput > 200) {
                    alert('You cannot exceed a total quantity of 200 for this item.');
                    return;
                }
                existingItem.quantity += quantityInput;
            } else {
                cart.push({
                    key: cartItemKey,
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    variant: selectedOption,
                    type: product.type,
                    quantity: quantityInput
                });
            }
            renderCart();
        }

        function removeFromCart(cartItemKey) {
            cart = cart.filter(item => item.key !== cartItemKey);
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartList.innerHTML = '<li style="color: #666; text-align: center;">Cart is empty</li>';
                cartTotal.innerHTML = 'Total: ₱0.00';
                return;
            }

            let total = 0;
            cartList.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                let variantLabel = item.type === 'shirt' ? `Size: ${item.variant}` : `Color: ${item.variant}`;
                return `
                    <li class="cart-item">
                        <div class="cart-item-details">
                            <strong>${item.name}</strong><br>
                            <small>${variantLabel}</small><br>
                            ₱${item.price.toFixed(2)} x ${item.quantity}
                        </div>
                        <button class="remove-btn" onclick="removeFromCart('${item.key}')">X</button>
                    </li>
                `;
            }).join('');

            cartTotal.innerHTML = `Total: ₱${total.toFixed(2)}`;
        }

        // Helper function to convert uploaded file into Base64 for the Apps Script payload
        function getFileBase64(file) {
            return new Promise((r, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => r(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function placeOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const email = document.getElementById('customer-email').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const fileInput = document.getElementById('payment-screenshot');

            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            if (!name || !email || !address || !phone || fileInput.files.length === 0) {
                alert('Please fill out all checkout fields and upload your payment screenshot.');
                return;
            }

            const orderBtn = document.getElementById('order-btn');
            orderBtn.disabled = true;
            orderBtn.innerText = 'Uploading & Processing...';

            try {
                let total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                let orderSummaryText = cart.map(i => `${i.name} (${i.type === 'shirt' ? 'Size' : 'Color'}: ${i.variant}) x ${i.quantity}`).join(', ');

                const file = fileInput.files[0];
                const base64Data = await getFileBase64(file);

                const orderData = {
                    name: name,
                    email: email,
                    address: address,
                    phone: phone,
                    items: orderSummaryText,
                    total: `₱${total.toFixed(2)}`,
                    fileName: file.name,
                    fileData: base64Data,
                    mimeType: file.type
                };

                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                alert(`Thank you for your order, ${name}!\nYour payment screenshot was uploaded, and a confirmation email has been sent to ${email}.`);
                
                cart = [];
                renderCart();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-email').value = '';
                document.getElementById('customer-address').value = '';
                document.getElementById('customer-phone').value = '';
                fileInput.value = '';

                // Refresh inventory status after placing an order
                fetchInventoryStatus();

            } catch (error) {
                console.error('Error:', error);
                alert('There was an error processing your order. Please try again.');
            } finally {
                orderBtn.disabled = false;
                orderBtn.innerText = 'Place Order';
            }
        }

        // Initialize by fetching inventory status or rendering products
        fetchInventoryStatus();
    </script>
</body>
</html>
